name: Validate M2 and full Colab notebook
on:
  push:
    branches: [main, m3-data-split, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r src/requirements-m2.txt
      - run: python -m unittest discover -s tests -v
